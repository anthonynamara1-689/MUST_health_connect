{# Blue page header used by the public pages: optional back link, title, lead text. #}
<section class="bg-brand text-white">
  <div class="page py-10 lg:py-14">
    {% if back_url %}
      <a href="{{ back_url }}" class="inline-flex items-center gap-1 rounded-md text-sm text-sky-100 transition hover:text-white">
        {% include "partials/icon.html" with name="chevron-left" cls="h-4 w-4" %} {{ back_label }}
      </a>
    {% endif %}
    <h1 class="mt-3 max-w-3xl text-balance text-[34px] font-extrabold leading-[1.08] tracking-[-0.02em] lg:text-5xl">{{ title }}</h1>
    {% if lead %}<p class="mt-3 max-w-2xl text-lg leading-relaxed text-sky-100 lg:text-xl">{{ lead }}</p>{% endif %}
  </div>
</section>
